apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-management-api
  labels:
    app: video-management-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: video-management-api

  template:
    metadata:
      labels:
        app: video-management-api
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: local
        tags.datadoghq.com/service: video-management-api
        tags.datadoghq.com/version: "1.0.0"

    spec:
      containers:
        - name: video-management-api
          image: video-management-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DD_LOGS_INJECTION
              value: "true"
          envFrom:
            - configMapRef:
                name: video-management-api-config
            - secretRef:
                name: video-management-api-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
