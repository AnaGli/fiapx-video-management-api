apiVersion: batch/v1
kind: Job
metadata:
  name: video-management-api-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: video-management-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: video-management-api-config
            - secretRef:
                name: video-management-api-secrets
